<title>Робот · без облака</title>
<!--
  ПУЛЬТ БЕЗ ОБЛАКА (18.11.2026) — запасной на крайний случай: ElevenLabs, интернет или мозг легли, а робот должен говорить.
  - никакого мозга и микрофона: только заранее записанные фразы — робот физически не может заговорить сам;
  - движок — пульт-сценарий Robby (DGAO 14.11): записи кладутся в память телефона, после первого открытия
    пульт открывается и играет без интернета (sw.js);
  - 🇩🇪/🇬🇧 вверху — на каком языке играют ВСЕ кнопки; у кнопки с ↻ несколько вариантов — каждое нажатие следующий;
  - одна запись за раз: новая обрывает старую; повторное нажатие на играющую — стоп.
  СОБИРАЕТСЯ, НЕ ПРАВИТСЯ РУКАМИ: тексты — fraze.json в папке пульта → python3 scripts/offline_pult.py <папка> → выложить.

<style>
:root{
  --bg:#0c0d10; --panel:#16181d; --line:#2a2e36; --txt:#ececec; --dim:#9aa0aa; --faint:#6b717c;
  --acc:#e0b040; --plate:#1e2733; --en:#2f6fd6; --ok:#57c785; --bad:#ff6b5a; --open:#e0b040;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{flex:none;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 16px 6px;padding-top:max(8px,env(safe-area-inset-top))}
.hrow{display:flex;align-items:center;gap:8px;justify-content:space-between}
.hrow2{display:flex;align-items:center;gap:8px;margin-top:6px}
.ttl{font-weight:700;font-size:15px;color:var(--acc);white-space:nowrap}
.ver{font-size:11px;color:var(--faint)}
#mem{color:var(--dim);white-space:nowrap;border:0;background:none;padding:2px 0;font-family:inherit;font-size:12px}
#mem.ok{color:var(--ok)} #mem.bad{color:var(--bad);font-weight:700}
#lang{flex:none;height:40px;min-width:76px;border-radius:10px;border:2px solid var(--acc);background:#1c1f26;color:var(--txt);
  font-weight:800;font-size:15px;font-family:inherit;touch-action:manipulation;padding:0 8px}
#lang.en{background:var(--en);border-color:var(--en);color:#fff}
#nav{flex:1;display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
#nav button{flex:1 0 40px;min-width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:#1c1f26;color:var(--txt);
  font-size:17px;font-family:inherit;touch-action:manipulation;padding:0}
#nav button.cur{border-color:var(--acc);background:#262a33}
#scroll{flex:1;position:relative;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 16px 120px}
.jwrap{border:1px solid var(--line);border-radius:14px;padding:4px 10px 10px;background:#111317;margin-top:12px}
.jwrap.glav{border-color:var(--acc)}
.jwrap h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:10px 2px 6px}
.jgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.jb{display:block;width:100%;text-align:left;border:0;border-radius:10px;background:var(--plate);color:var(--txt);padding:8px 10px;min-height:58px;
  font-family:inherit;touch-action:manipulation;user-select:none;-webkit-user-select:none;position:relative;overflow:hidden}
.jb b{display:block;font-size:14px;line-height:1.25;padding-right:26px}
.jb small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:11px;color:var(--dim);overflow:hidden;margin-top:3px}
.jb .vb{position:absolute;right:7px;top:6px;font-size:10px;color:var(--open);font-weight:700}
.jb .fx{position:absolute;right:7px;top:6px;font-size:10px;color:#fff;background:var(--en);border-radius:4px;padding:0 4px;font-weight:700}
.jb .fx.de{background:#555}
.bar{position:absolute;left:0;bottom:0;height:4px;width:0;background:#fff;opacity:.85}
.playing{background:var(--acc)!important;color:#fff!important}
.playing small,.playing .vb{color:#fff!important}
.jb.done:not(.playing){opacity:.62}
#stop{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:5;display:none;border:0;border-radius:14px;
  background:#c62828;color:#fff;font-weight:700;font-size:18px;line-height:1.2;font-family:inherit;padding:14px 12px;box-shadow:0 6px 24px #000a;touch-action:manipulation}
#stop small{display:block;font-weight:500;font-size:12px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#banner{display:none;background:var(--bad);color:#fff;font-weight:700;padding:8px 16px;font-size:14px}
.foot{margin:28px 0 0;color:var(--faint);font-size:12px;text-align:center}
.foot button{background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:8px 14px;font-family:inherit;margin-bottom:8px}
@media (min-width:700px){ #scroll,header{padding-left:max(16px,calc(50% - 340px));padding-right:max(16px,calc(50% - 340px))} .jgrid{grid-template-columns:1fr 1fr 1fr} }
</style>
</head>

  </header>
  <div id="banner"></div>

</div>

<script>
const VERSION = '18.11.2026 Без облака · 1';
const PROIGRYVATEL = true;   // пульт-проигрыватель: только записи, без мозга — proverit_pult.py проверяет его по-своему
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bezTegov = t => String(t ?? '').replace(/\[[^\]]*\]\s*/g, '');
$('ver').textContent = 'v'+VERSION.split('· ').pop();

let F = null, ITEMS = {}, ALL = [];
let LANG = 'de';                                  // язык НЕ запоминается: каждый раз пульт открывается на немецком
const player = new Audio();
player.preload = 'auto';
let cur = null, curClip = null, curEls = [], curT = 0, raf = 0;

function banner(t){ const b=$('banner'); b.textContent=t||''; b.style.display=t?'block':'none'; }

// ---- какой вариант и на каком языке сыграет кнопка ----
function klip(it){
  const v = it.v[it.idx % it.v.length];
  return v[LANG] || v.de || v.en;                 // фраза только на одном языке (например «да, говорю по-английски») играет всегда его
}
function els(id){ return [...document.querySelectorAll('[data-id="'+id+'"]')]; }
function podpis(it){                              // обновить текст под кнопкой (что сыграет при следующем нажатии)
  const k = klip(it);
  els(it.id).forEach(e=>{
    e.querySelector('small').textContent = bezTegov(k.t);
    const vb = e.querySelector('.vb'); if(vb) vb.textContent = '↻ '+((it.idx % it.v.length)+1)+'/'+it.v.length;
  });
}

// ---- воспроизведение: одна запись за раз ----
function stop(){
  try{ player.pause(); }catch{}
  curEls.forEach(e=>{ e.classList.remove('playing'); const b=e.querySelector('.bar'); if(b) b.style.width='0'; });
  cur=null; curClip=null; curEls=[]; cancelAnimationFrame(raf); $('stop').style.display='none';
}
function tick(){
  if(!cur) return;
  const d = player.duration || curClip.d || 1, w = Math.min(100, (player.currentTime/d)*100) + '%';
  curEls.forEach(e=>{ const b=e.querySelector('.bar'); if(b) b.style.width=w; });
  raf = requestAnimationFrame(tick);
}
function play(it){
  if(cur === it){ if(performance.now()-curT < 1200) return; stop(); return; }   // дрогнул палец — не перезапускать; ещё раз — стоп
  stop();
  const k = klip(it);
  cur = it; curClip = k; curT = performance.now(); curEls = els(it.id);
  curEls.forEach(e=>e.classList.add('playing','done'));
  $('stopTx').textContent = bezTegov(k.t);
  $('stop').style.display = 'block';
  player.src = k.blob || (k.f + '?h=' + (k.h||''));
  const me = it;
  player.play().then(()=>{ if(cur===me) tick(); banner(''); }).catch(e=>{
    if(cur!==me || e?.name==='AbortError') return;
    stop(); banner('⚠️ Запись не сыграла: «' + bezTegov(k.t).slice(0,40) + '…» — нажми ещё раз');
  });
  if(it.v.length > 1){ it.idx = (it.idx + 1) % it.v.length; setTimeout(()=>podpis(it), 50); }   // следующее нажатие — следующий вариант
  keepAwake();
}
player.onended = () => stop();
player.onerror = () => { if(cur){ const t=bezTegov(curClip.t); stop(); banner('⚠️ Запись не сыграла: «'+t.slice(0,40)+'…» — нажми ещё раз'); } };
$('stop').onclick = stop;

// ---- язык: одна кнопка на весь пульт ----
function setLang(l){
  LANG = l; const b=$('lang');
  b.textContent = l==='en' ? '🇬🇧 EN' : '🇩🇪 DE'; b.classList.toggle('en', l==='en');
  Object.values(ITEMS).forEach(podpis);
}
$('lang').onclick = () => setLang(LANG==='de' ? 'en' : 'de');

// ---- отрисовка ----
function knopka(it){
  const b=document.createElement('button'); b.type='button'; b.className='jb'; b.dataset.id=it.id;
  const odin = it.v.every(v=>!(v.de && v.en)) ? (it.v[0].en ? 'en' : 'de') : '';
  const metka = it.v.length>1 ? '<span class="vb"></span>' : (odin ? '<span class="fx '+odin+'">'+odin.toUpperCase()+'</span>' : '');
  b.innerHTML='<b>'+esc(it.ru)+'</b>'+metka+'<small></small><span class="bar"></span>';
  b.onclick=()=>play(it);
  return b;
}
function gruppa(g, kopiya){
  const w=document.createElement('div'); w.className='jwrap'+(g.povtor_vnizu?' glav':''); w.id='g-'+g.id+(kopiya?'-niz':'');
  const h=document.createElement('h2'); h.textContent=g.nav+' '+g.ru; w.appendChild(h);
  const grid=document.createElement('div'); grid.className='jgrid';
  g.items.forEach(it=>grid.appendChild(knopka(ITEMS[it.id])));
  w.appendChild(grid);
  return w;
}
function render(){
  const m=$('scroll'); m.innerHTML='';
  F.groups.forEach(g=>m.appendChild(gruppa(g)));
  F.groups.filter(g=>g.povtor_vnizu).forEach(g=>m.appendChild(gruppa(g, true)));   // главное — ещё раз внизу, как джокеры у Robby
  const f=document.createElement('div'); f.className='foot';
  f.innerHTML='<button type="button" id="reset">↺ снять отметки (новый гость)</button><br>'+esc(VERSION)+' · '+ALL.length+' записей · без облака: ни мозга, ни микрофона';
  m.appendChild(f);
  $('reset').onclick=()=>{ document.querySelectorAll('.done').forEach(e=>e.classList.remove('done')); };
  Object.values(ITEMS).forEach(podpis);
  const nav=$('nav'); nav.innerHTML='';
  const go=id=>{ const t=$(id), sc=$('scroll'); if(t){ sc.scrollTop = t.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop - 6; navCur(); } };
  F.groups.forEach(g=>{ const b=document.createElement('button'); b.type='button'; b.textContent=g.nav; b.title=g.ru; b.dataset.to='g-'+g.id; b.onclick=()=>go('g-'+g.id); nav.appendChild(b); });
}
function navCur(){
  const sc=$('scroll'), y=sc.scrollTop+60; let curId='g-'+F.groups[0].id;
  F.groups.forEach(g=>{ const e=$('g-'+g.id); if(e && e.offsetTop<=y) curId='g-'+g.id; });
  if(sc.scrollTop+sc.clientHeight>=sc.scrollHeight-4) curId='g-'+F.groups[0].id;   // внизу — повтор «главного»
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('cur',b.dataset.to===curId));
}

// ---- все записи — в память телефона (дальше сеть не нужна) ----
const KESH='offline-pult-v1';
let kesh=null;
async function otkrytKesh(){ try{ kesh = await caches.open(KESH); }catch{ kesh=null; } }
function sTaimautom(url, ms, opt={}){ const ac=new AbortController(); const t=setTimeout(()=>ac.abort(), ms);
  return fetch(url,{...opt, signal:ac.signal}).finally(()=>clearTimeout(t)); }
async function zagruzit(k){
  const url = new URL(k.f+'?h='+(k.h||''), location.href).href;
  let r=null;
  try{ r = kesh ? await kesh.match(url) : null; }catch{ r=null; }
  if(!r){ r = await sTaimautom(url, 20000); if(!r.ok) throw new Error(r.status); try{ if(kesh) await kesh.put(url, r.clone()); }catch{} }
  k.blob = URL.createObjectURL(await r.blob());
}
async function stranicuVPamyat(){ try{ if(!kesh) return; const r=await sTaimautom('./', 20000, {cache:'no-store'});
  if(r.ok) await kesh.put(new URL('./', location.href).href, r); }catch{} }
let memOk=0, memBad=0;
function memShow(){ const m=$('mem');
  m.className = memBad ? 'bad' : (memOk===ALL.length ? 'ok' : '');
  m.textContent = memBad ? '⚠️ '+memBad+' не скачались — нажми' : (memOk===ALL.length ? '🎧 все '+ALL.length+' в памяти' : '🎧 '+memOk+' из '+ALL.length+'…'); }
function vPamyat(){
  const todo=ALL.filter(k=>!k.blob && !k._idet);
  memBad=0; memOk=ALL.filter(k=>k.blob).length; memShow();
  todo.forEach(k=>{ k._idet=true;
    zagruzit(k).then(()=>{ memOk++; }).catch(()=>{ memBad++; }).finally(()=>{ k._idet=false; memShow(); });
  });
}
$('mem').onclick=()=>vPamyat();
window.addEventListener('online',()=>{ if(ALL.some(k=>!k.blob)) vPamyat(); });

// ---- экран не гаснет ----
let wakeLock=null;
async function keepAwake(){ if(wakeLock) return; try{ wakeLock=await navigator.wakeLock?.request('screen'); wakeLock?.addEventListener?.('release',()=>{ wakeLock=null; }); }catch{} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') keepAwake(); });

(async()=>{
